services:
  - type: web
    name: onuja-jonathan-graphics
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSISTENT_DIRECTORY
        value: /var/data
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
